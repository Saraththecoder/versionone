<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Ground Shadow -->
    <radialGradient id="sShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- 3D Skin Gradient -->
    <radialGradient id="sSkin" cx="42%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFE8D6"/>
      <stop offset="65%" stop-color="#FDCBA8"/>
      <stop offset="100%" stop-color="#E8A27A"/>
    </radialGradient>
    <!-- Neck Shadow -->
    <linearGradient id="sNeck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D98D67"/>
      <stop offset="100%" stop-color="#F7C29E"/>
    </linearGradient>
    <!-- 3D Brown Hair Gradient -->
    <radialGradient id="sHair" cx="38%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#8B5338"/>
      <stop offset="55%" stop-color="#5E331F"/>
      <stop offset="100%" stop-color="#3B1D10"/>
    </radialGradient>
    <!-- Cheek Blush -->
    <radialGradient id="sBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7B7B" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#FF7B7B" stop-opacity="0"/>
    </radialGradient>
    <!-- Mustard Sweater 3D Gradient -->
    <linearGradient id="sSweater" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C"/>
      <stop offset="55%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#C97A0C"/>
    </linearGradient>
    <!-- Blue Backpack Strap 3D Gradient -->
    <linearGradient id="sStrap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6098FF"/>
      <stop offset="50%" stop-color="#3A72E8"/>
      <stop offset="100%" stop-color="#204BB3"/>
    </linearGradient>
  </defs>

  <!-- Soft Drop Shadow -->
  <ellipse cx="120" cy="212" rx="68" ry="12" fill="url(#sShadow)" />

  <!-- Blue Backpack Behind Shoulders -->
  <path d="M56 154 C52 130, 74 122, 120 122 C166 122, 188 130, 184 154 L180 198 L60 198 Z" fill="#2A58C7" />

  <!-- Mustard Sweater Bust -->
  <path d="M62 204 C62 162, 82 146, 120 146 C158 146, 178 162, 178 204 C178 210, 170 212, 160 212 L80 212 C70 212, 62 210, 62 204 Z" fill="url(#sSweater)" />
  <!-- Sweater Center Shading -->
  <path d="M90 150 Q120 175 150 150" fill="none" stroke="#BA6F07" stroke-width="2" opacity="0.25" />

  <!-- Crisp White Shirt Collar -->
  <path d="M96 146 L120 165 L144 146 Q120 154 96 146 Z" fill="#FFFFFF" />
  <path d="M100 146 L120 162 L140 146" fill="none" stroke="#E2E8F0" stroke-width="2" />

  <!-- Left & Right 3D Blue Backpack Straps -->
  <path d="M76 152 C74 172, 74 195, 76 212 L94 212 C92 194, 92 170, 94 148 Z" fill="url(#sStrap)" />
  <path d="M146 148 C148 170, 148 194, 146 212 L164 212 C166 195, 166 172, 164 152 Z" fill="url(#sStrap)" />
  <!-- Strap Buckles & Highlight -->
  <rect x="75" y="184" width="19" height="6" rx="2" fill="#183A8A" />
  <rect x="146" y="184" width="19" height="6" rx="2" fill="#183A8A" />
  <path d="M80 154 L80 180" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.55" />
  <path d="M158 154 L158 180" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.55" />

  <!-- Neck -->
  <rect x="106" y="126" width="28" height="28" rx="12" fill="url(#sNeck)" />

  <!-- Ears with Inner Shading -->
  <ellipse cx="74" cy="96" rx="10" ry="13" fill="#F2B48E" />
  <ellipse cx="75" cy="96" rx="5.5" ry="7.5" fill="#D98D67" opacity="0.55" />
  <ellipse cx="166" cy="96" rx="10" ry="13" fill="#F2B48E" />
  <ellipse cx="165" cy="96" rx="5.5" ry="7.5" fill="#D98D67" opacity="0.55" />

  <!-- Back Hair Layer -->
  <path d="M74 88 C70 50, 94 34, 120 34 C146 34, 170 50, 166 88 Z" fill="#462213" />

  <!-- 3D Rounded Face -->
  <path d="M77 86 C77 56, 95 45, 120 45 C145 45, 163 56, 163 86 C163 118, 145 138, 120 138 C95 138, 77 118, 77 86 Z" fill="url(#sSkin)" />

  <!-- Soft Rosy Cheek Blushes -->
  <ellipse cx="92" cy="105" rx="12" ry="8" fill="url(#sBlush)" />
  <ellipse cx="148" cy="105" rx="12" ry="8" fill="url(#sBlush)" />

  <!-- Sculpted Nose -->
  <path d="M117 95 Q120 103 123 95" fill="none" stroke="#D98D67" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="120" cy="96" rx="4" ry="2.5" fill="#FFEFE4" opacity="0.6" />

  <!-- Eyebrows -->
  <path d="M90 77 Q98 72 106 76" fill="none" stroke="#4D2716" stroke-width="3.2" stroke-linecap="round" />
  <path d="M134 76 Q142 72 150 77" fill="none" stroke="#4D2716" stroke-width="3.2" stroke-linecap="round" />

  <!-- Expressive 3D Eyes with Catchlights -->
  <ellipse cx="98" cy="89" rx="5" ry="6" fill="#1F1815" />
  <circle cx="96.5" cy="86.8" r="2" fill="#FFFFFF" />
  <circle cx="100" cy="91" r="0.9" fill="#FFFFFF" opacity="0.6" />

  <ellipse cx="142" cy="89" rx="5" ry="6" fill="#1F1815" />
  <circle cx="140.5" cy="86.8" r="2" fill="#FFFFFF" />
  <circle cx="144" cy="91" r="0.9" fill="#FFFFFF" opacity="0.6" />

  <!-- Joyful Open Smile -->
  <path d="M104 111 Q120 128 136 111 Q120 115 104 111 Z" fill="#8C2626" />
  <!-- Upper Teeth -->
  <path d="M107 112 Q120 115 133 112 L131 117 Q120 119 109 117 Z" fill="#FFFFFF" />
  <!-- Tongue -->
  <ellipse cx="120" cy="121" rx="7" ry="3.5" fill="#FF6B7B" />

  <!-- 3D Swoopy Front Hair Crest -->
  <path d="M74 86 C70 60, 82 32, 118 28 C148 25, 168 44, 166 86 C164 68, 154 58, 144 57 C134 56, 126 65, 114 64 C96 63, 86 58, 74 86 Z" fill="url(#sHair)" />
  <!-- Glossy Hair Specular Wave -->
  <path d="M92 42 Q120 32 144 42" fill="none" stroke="#B57B5C" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />
</svg>
