<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%" fill="none">
  <!-- Organic Peach / Coral Backdrop Blob (Matching Reference Screen 3) -->
  <path d="M60 130 C40 60, 110 30, 200 25 C310 20, 420 50, 430 130 C440 210, 360 255, 250 260 C140 265, 80 200, 60 130 Z" fill="#FFE5D3" />
  <path d="M90 140 C80 80, 140 50, 210 45 C300 40, 390 70, 400 135 C410 200, 340 240, 240 245 C150 250, 100 195, 90 140 Z" fill="#FFEDDF" />

  <!-- Ground Shadow -->
  <ellipse cx="260" cy="235" rx="160" ry="10" fill="#E2C7B7" opacity="0.6" />

  <!-- ==================== SCHOOL BUS ==================== -->
  <g transform="translate(45, 60)">
    <!-- Rear & Front Tires -->
    <circle cx="55" cy="145" r="22" fill="#1E293B" />
    <circle cx="55" cy="145" r="11" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5" />
    
    <circle cx="230" cy="145" r="22" fill="#1E293B" />
    <circle cx="230" cy="145" r="11" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5" />

    <!-- Bus Body -->
    <path d="M15 130 L15 65 Q15 45 40 45 L240 45 Q265 45 275 75 L285 110 L285 130 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3.5" />
    <!-- Front Hood Slope -->
    <path d="M245 45 L275 75 L285 110 L245 110 Z" fill="#F59E0B" />

    <!-- Roof Ribs -->
    <rect x="50" y="40" width="180" height="6" rx="3" fill="#D97706" />

    <!-- Side Windows Row -->
    <g>
      <rect x="35" y="56" width="30" height="34" rx="6" fill="#BAE6FD" stroke="#0284C7" stroke-width="2" />
      <rect x="75" y="56" width="30" height="34" rx="6" fill="#BAE6FD" stroke="#0284C7" stroke-width="2" />
      <rect x="115" y="56" width="30" height="34" rx="6" fill="#BAE6FD" stroke="#0284C7" stroke-width="2" />
      <rect x="155" y="56" width="30" height="34" rx="6" fill="#BAE6FD" stroke="#0284C7" stroke-width="2" />
      <!-- Driver Front Windshield -->
      <path d="M195 56 L235 56 L248 88 L195 88 Z" fill="#BAE6FD" stroke="#0284C7" stroke-width="2" />
    </g>

    <!-- Side Strip with "SCHOOL BUS" Text -->
    <rect x="25" y="98" width="220" height="18" rx="4" fill="#0F172A" />
    <text x="135" y="111" text-anchor="middle" font-family="'Fredoka', 'Outfit', sans-serif" font-weight="800" font-size="11" fill="#FBBF24" letter-spacing="2">
      SCHOOL BUS
    </text>

    <!-- Side Indicators / Lights -->
    <circle cx="275" cy="118" r="6" fill="#FEF08A" stroke="#EA580C" stroke-width="2" />
    <circle cx="25" cy="118" r="5" fill="#EF4444" stroke="#991B1B" stroke-width="1.5" />

    <!-- Front & Rear Bumpers -->
    <rect x="5" y="128" width="18" height="14" rx="4" fill="#94A3B8" />
    <rect x="278" y="128" width="18" height="14" rx="4" fill="#94A3B8" />
  </g>

  <!-- ==================== BUS DRIVER CHARACTER ==================== -->
  <g transform="translate(320, 68)">
    <!-- Shadow -->
    <ellipse cx="25" cy="172" rx="22" ry="6" fill="#0F172A" opacity="0.3" />

    <!-- Legs & Blue Trousers -->
    <path d="M14 125 L14 165 L21 165 L22 125" fill="#1E3A8A" />
    <path d="M28 125 L29 165 L36 165 L36 125" fill="#1E3A8A" />
    <!-- Black Shoes -->
    <ellipse cx="16" cy="167" rx="7" ry="4" fill="#0F172A" />
    <ellipse cx="34" cy="167" rx="7" ry="4" fill="#0F172A" />

    <!-- Blue Uniform Jacket / Shirt -->
    <path d="M6 75 Q25 70 44 75 L42 125 Q25 128 8 125 Z" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="1.5" />
    <!-- Gold Buttons & Belt -->
    <rect x="8" y="120" width="34" height="6" fill="#0F172A" />
    <rect x="22" y="120" width="6" height="6" fill="#FBBF24" />
    <circle cx="25" cy="85" r="2" fill="#FBBF24" />
    <circle cx="25" cy="98" r="2" fill="#FBBF24" />
    <circle cx="25" cy="110" r="2" fill="#FBBF24" />
    <!-- Gold Badge on Chest -->
    <polygon points="14,84 18,84 19,88 16,91 13,88" fill="#FBBF24" />

    <!-- Arms -->
    <path d="M7 76 L-2 105 L6 108 L12 85 Z" fill="#1D4ED8" />
    <circle cx="1" cy="110" r="4.5" fill="#FED7AA" /> <!-- Hand -->
    
    <path d="M43 76 L52 105 L44 108 L38 85 Z" fill="#1D4ED8" />
    <circle cx="49" cy="110" r="4.5" fill="#FED7AA" /> <!-- Hand -->

    <!-- Head & Neck -->
    <rect x="21" y="65" width="8" height="12" fill="#FDBA74" />
    <ellipse cx="25" cy="52" rx="14" ry="15" fill="#FED7AA" />

    <!-- Friendly Face Features -->
    <ellipse cx="20" cy="48" rx="2" ry="2.5" fill="#0F172A" />
    <ellipse cx="30" cy="48" rx="2" ry="2.5" fill="#0F172A" />
    <!-- Neat Groomed Beard / Mustache -->
    <path d="M18 56 Q25 61 32 56" stroke="#451A03" stroke-width="2" fill="none" />
    <path d="M19 58 Q25 63 31 58" fill="#FFFFFF" />

    <!-- Driver Cap with Gold Band & Visor -->
    <ellipse cx="25" cy="38" rx="16" ry="7" fill="#1E3A8A" />
    <path d="M10 40 Q25 33 40 40 L40 44 L10 44 Z" fill="#1E3A8A" />
    <path d="M9 44 Q25 41 41 44" stroke="#FBBF24" stroke-width="2.5" fill="none" />
    <!-- Shiny Visor -->
    <path d="M8 44 Q25 48 42 44 L40 47 Q25 50 10 47 Z" fill="#0F172A" />
  </g>
</svg>
